name: Publish

# Inert until you push a version tag (e.g. `git tag v0.1.0 && git push --tags`)
# AND add an `NPM_TOKEN` repository secret (an npm automation token).
# `prepublishOnly` (build + smoke) runs automatically as part of `npm publish`.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # enables npm provenance attestation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm ci
      # Idempotent: a re-pushed tag (or a version already published manually)
      # skips the publish instead of failing on npm's duplicate-version 403.
      - id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "thredz-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "already published thredz-mcp@${VERSION} — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
